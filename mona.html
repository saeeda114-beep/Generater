<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية لـ منى</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.75); --accent: #f59e0b; --text-main: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background-image: radial-gradient(circle at 50% 10%, #f59e0b22 0%, transparent 60%); }
        .container { width: 100%; max-width: 480px; background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .badge { display: inline-block; padding: 6px 16px; background: #f59e0b20; color: var(--accent); border: 1px solid #f59e0b40; border-radius: 50px; font-size: 14px; font-weight: 700; margin-bottom: 16px; }
        .title { font-size: 28px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
        .subtitle { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; }
        .cover-wrapper { position: relative; width: 100%; height: 220px; border-radius: 16px; overflow: hidden; margin-bottom: 24px; border: 1px solid #f59e0b40; box-shadow: 0 8px 20px #f59e0b20; }
        .cover-image { width: 100%; height: 100%; object-fit: cover; }
        .message-box { background: rgba(15, 23, 42, 0.6); border-right: 4px solid var(--accent); padding: 18px 20px; border-radius: 12px; text-align: right; font-size: 16px; line-height: 1.8; color: #e2e8f0; margin-bottom: 28px; white-space: pre-line; }
        .btn-drive { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; background: var(--accent); color: #ffffff; text-decoration: none; padding: 16px 24px; font-size: 18px; font-weight: 700; border-radius: 14px; box-shadow: 0 10px 25px #f59e0b30; transition: all 0.3s ease; }
        .footer { margin-top: 32px; font-size: 13px; color: var(--text-muted); opacity: 0.7; }
    </style>
</head>
