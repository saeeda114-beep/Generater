<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولّد صفحات الهدايا NFC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 30px 15px; display: flex; justify-content: center; }
        .form-card { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 24px; width: 100%; max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h1 { color: #f59e0b; font-size: 22px; margin-bottom: 6px; text-align: center; }
        p.sub { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #cbd5e1; }
        input, textarea, select { width: 100%; padding: 12px; background-color: #0f172a; border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: #f59e0b; }
        .row { display: flex; gap: 12px; }
        .row .form-group { flex: 1; }
        .color-picker-wrapper { display: flex; align-items: center; gap: 12px; background: #0f172a; border: 1px solid var(--border); padding: 6px 12px; border-radius: 10px; }
        input[type="color"] { width: 36px; height: 36px; border: none; cursor: pointer; background: transparent; padding: 0; }
        
        .image-option-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
        .tab-btn { flex: 1; padding: 8px; background: #0f172a; border: 1px solid var(--border); color: #94a3b8; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; text-align: center; }
        .tab-btn.active { background: #f59e0b; color: #000; border-color: #f59e0b; }

        button.submit-btn { width: 100%; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #fff; border: none; padding: 16px; font-size: 17px; font-weight: 700; border-radius: 12px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="form-card">
        <h1>🎁 مولّد صفحات الهدايا NFC</h1>
        <p class="sub">أدخل بيانات العميل لتوليد ملف index.html فوراً</p>

        <form id="giftForm">
            <div class="row">
                <div class="form-group">
                    <label>اسم المهدى إليه</label>
                    <input type="text" id="recipient" placeholder="أحمد" required>
                </div>
                <div class="form-group">
                    <label>اسم المُهدي</label>
                    <input type="text" id="sender" placeholder="والدك" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>نوع المناسبة</label>
                    <select id="occasion">
                        <option value="عيد ميلاد سعيد 🎂">عيد ميلاد 🎂</option>
                        <option value="تخرج مبارك 🎓">تخرج 🎓</option>
                        <option value="زواج مبارك 💍">زواج 💍</option>
                        <option value="ذكرى سعيدة ❤️">ذكرى خاصة ❤️</option>
                        <option value="مولود جديد 👶">مولود جديد 👶</option>
                        <option value="هدية خاصة 🎁">عام / أخرى 🎁</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نوع الخط</label>
                    <select id="fontFamily">
                        <option value="'Tajawal', sans-serif">تجوال (فخم)</option>
                        <option value="'Amiri', serif">أميري (كلاسيكي)</option>
                        <option value="'Cairo', sans-serif">القاهرة (حديث)</option>
                        <option value="'Almarai', sans-serif">المراعي (بسيط)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>لون التصميم الرئيسية</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="themeColor" value="#f59e0b">
                    <span id="colorHex" style="font-size: 13px; color: #94a3b8;">#f59e0b</span>
                </div>
            </div>

            <div class="form-group">
                <label>صورة الغلاف</label>
                <div class="image-option-tabs">
                    <div class="tab-btn active" onclick="switchImageSource('upload')">📱 من الاستديو</div>
                    <div class="tab-btn" onclick="switchImageSource('link')">🔗 رابط أو اسم ملف</div>
                </div>

                <!-- خيار 1: اختيار من الجوال -->
                <input type="file" id="coverFile" accept="image/*">
                
                <!-- خيار 2: كتابة اسم ملف أو رابط -->
                <input type="text" id="coverUrl" placeholder="cover.jpg أو رابط صورة..." style="display: none;">
            </div>

            <div class="form-group">
                <label>رابط Google Drive</label>
                <input type="url" id="driveUrl" placeholder="https://drive.google.com/..." required>
            </div>

            <div class="form-group">
                <label>الرسالة الخاصة</label>
                <textarea id="message" rows="3" placeholder="اكتب نص إهداء العميل..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">⚡ إنشاء وتحميل الصفحة (index.html)</button>
        </form>
    </div>

    <script>
        let imageMode = 'upload';

        function switchImageSource(mode) {
            imageMode = mode;
            const fileInput = document.getElementById('coverFile');
            const urlInput = document.getElementById('coverUrl');
            const tabs = document.querySelectorAll('.tab-btn');

            if (mode === 'upload') {
                fileInput.style.display = 'block';
                urlInput.style.display = 'none';
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
            } else {
                fileInput.style.display = 'none';
                urlInput.style.display = 'block';
                tabs[1].classList.add('active');
                tabs[0].classList.remove('active');
            }
        }

        document.getElementById('themeColor').addEventListener('input', (e) => {
            document.getElementById('colorHex').textContent = e.target.value;
        });

        document.getElementById('giftForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            let coverSrc = "cover.jpg"; // الافتراضي

            if (imageMode === 'upload') {
                const fileInput = document.getElementById('coverFile');
                if (fileInput.files && fileInput.files[0]) {
                    // تحويل الصورة المرفوعة إلى Base64
                    coverSrc = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(fileInput.files[0]);
                    });
                }
            } else {
                coverSrc = document.getElementById('coverUrl').value || "cover.jpg";
            }

            const recipient = document.getElementById('recipient').value;
            const sender = document.getElementById('sender').value;
            const occasion = document.getElementById('occasion').value;
            const fontFamily = document.getElementById('fontFamily').value;
            const themeColor = document.getElementById('themeColor').value;
            const driveUrl = document.getElementById('driveUrl').value;
            const message = document.getElementById('message').value;

            const generatedHtml = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية لـ ${recipient}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.75); --accent: ${themeColor}; --text-main: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: ${fontFamily}; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background-image: radial-gradient(circle at 50% 10%, ${themeColor}22 0%, transparent 60%); }
        .container { width: 100%; max-width: 480px; background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .badge { display: inline-block; padding: 6px 16px; background: ${themeColor}20; color: var(--accent); border: 1px solid ${themeColor}40; border-radius: 50px; font-size: 14px; font-weight: 700; margin-bottom: 16px; }
        .title { font-size: 28px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
        .subtitle { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; }
        .cover-wrapper { position: relative; width: 100%; height: 220px; border-radius: 16px; overflow: hidden; margin-bottom: 24px; border: 1px solid ${themeColor}40; box-shadow: 0 8px 20px ${themeColor}20; }
        .cover-image { width: 100%; height: 100%; object-fit: cover; }
        .message-box { background: rgba(15, 23, 42, 0.6); border-right: 4px solid var(--accent); padding: 18px 20px; border-radius: 12px; text-align: right; font-size: 16px; line-height: 1.8; color: #e2e8f0; margin-bottom: 28px; white-space: pre-line; }
        .btn-drive { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; background: var(--accent); color: #ffffff; text-decoration: none; padding: 16px 24px; font-size: 18px; font-weight: 700; border-radius: 14px; box-shadow: 0 10px 25px ${themeColor}30; transition: all 0.3s ease; }
        .footer { margin-top: 32px; font-size: 13px; color: var(--text-muted); opacity: 0.7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">${occasion}</div>
        <h1 class="title">إلى ${recipient} ❤️</h1>
        <p class="subtitle">هدية خاصة مُقدمة من: ${sender}</p>

        <div class="cover-wrapper">
            <img src="${coverSrc}" alt="الغلاف" class="cover-image">
        </div>

        <div class="message-box">${message}</div>

        <a href="${driveUrl}" target="_blank" class="btn-drive">
            <span>📁 عرض الذكريات والملفات</span>
        </a>

        <div class="footer">
            تمت البرمجة بحب ✦ NFC Gift
        </div>
    </div>
</body>
</html>`;

            const blob = new Blob([generatedHtml], { type: 'text/html;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'index.html';
            link.click();
            URL.revokeObjectURL(link.href);
        });
    </script>
</body>
</html>
